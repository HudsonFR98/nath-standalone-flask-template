variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - populate-proxy
  - docker
  - test
  - demo
  - prod

.deploy_via_ansible: &deploy_via_ansible
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env $CONTEXT --docker-image $DOCKER_IMAGE --docker-registry $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD --container-registry-server $CI_REGISTRY --dependency-proxy-server $CI_DEPENDENCY_PROXY_SERVER --dependency-proxy-username $CI_DEPENDENCY_PROXY_USER --dependency-proxy-password $CI_DEPENDENCY_PROXY_PASSWORD --postgres-user $POSTGRES_USER --postgres-password $POSTGRES_PASSWORD --postgres-db $POSTGRES_DB --nsft-db-name $NSFT_DB_NAME --secret-key $SECRET_KEY --telegram-bot-token $TELEGRAM_BOT_TOKEN --telegram-chat-id $TELEGRAM_CHAT_ID --admin-user-username admin --admin-user-password $ADMIN_USER_PASSWORD --admin-user-first-name Nathanaël --admin-user-last-name Debanne --admin-user-email natha.debanne@gmail.com


populate_dependency_proxy:
  stage: populate-proxy
  image: docker:28.1.1
  before_script:
    - echo "Debug: CI_DEPENDENCY_PROXY_SERVER=${CI_DEPENDENCY_PROXY_SERVER}"
    - echo "Debug: CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
    # Ensure protocol is included in dependency proxy server URL
    - |
      if [[ ! "$CI_DEPENDENCY_PROXY_SERVER" =~ ^https?:// ]]; then
        export CI_DEPENDENCY_PROXY_SERVER="http://${CI_DEPENDENCY_PROXY_SERVER}"
        echo "Added http:// prefix: CI_DEPENDENCY_PROXY_SERVER=${CI_DEPENDENCY_PROXY_SERVER}"
      fi
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - echo "Populating dependency proxy with nath used images..."
    - |
      pull_image() {
        local image=$1
        local proxy_image="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${image}"
        echo "Attempting to pull ${proxy_image}..."
        
        # Try pulling from dependency proxy
        if docker pull "${proxy_image}" 2>&1; then
          echo "✓ Successfully pulled ${image} from dependency proxy"
          return 0
        else
          local exit_code=$?
          echo "✗ Failed to pull ${image} from dependency proxy (exit code: ${exit_code})"
          echo "This might indicate the dependency proxy needs to be configured or the image path is incorrect."
          echo "The dependency proxy should automatically cache images from Docker Hub on first pull."
          return ${exit_code}
        fi
      }
    - pull_image "python:3.11-slim" || echo "Continuing despite error..."
    - pull_image "docker:28.1.1" || echo "Continuing despite error..."
    - pull_image "docker:28.1.1-dind" || echo "Continuing despite error..."
    - pull_image "postgres:15" || echo "Continuing despite error..."
    - pull_image "nginx:alpine" || echo "Continuing despite error..."
    - pull_image "redis:7-alpine" || echo "Continuing despite error..."
    - pull_image "alpine:latest" || echo "Continuing despite error..."
    - echo "Dependency proxy population completed!"
  only:
    - master
    - tags
  when: manual
  tags:
    - docker

build_docker:
  stage: docker
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Ensure protocol is included in dependency proxy server URL
    - |
      if [[ ! "$CI_DEPENDENCY_PROXY_SERVER" =~ ^https?:// ]]; then
        export CI_DEPENDENCY_PROXY_SERVER="http://${CI_DEPENDENCY_PROXY_SERVER}"
      fi
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - docker info
    - docker build --build-arg BASE_IMAGE=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags
  tags:
    - docker

pytest:
  stage: test
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.test.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: test
    POSTGRES_PASSWORD: $TEST_POSTGRES_PASSWORD
    NSFT_DB_NAME: $TEST_NSFT_DB_NAME
    SECRET_KEY: $TEST_SECRET_KEY
    ADMIN_USER_PASSWORD: $TEST_ADMIN_USER_PASSWORD
  environment:
    name: test
    url: https://nsft.test.nath-server.home
  needs:
    - build_docker
  tags:
    - docker

pep8:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  script:
    - pip install flake8
    - flake8 nath_standalone_flask_template | tee pep8.out || true
  allow_failure: true
  artifacts:
    paths:
      - pep8.out
    expire_in: 1 week
  when: manual
  tags:
    - docker

deploy_demo:
  stage: demo
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.demo.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: demo
    POSTGRES_PASSWORD: $DEMO_POSTGRES_PASSWORD
    NSFT_DB_NAME: $DEMO_NSFT_DB_NAME
    SECRET_KEY: $DEMO_SECRET_KEY
    ADMIN_USER_PASSWORD: $DEMO_ADMIN_USER_PASSWORD
  when: manual
  environment:
    name: demo
    url: https://nsft.demo.nath-server.home
  needs:
    - build_docker
    - pytest
  tags:
    - docker

deploy_prod:
  stage: prod
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: prod
    POSTGRES_PASSWORD: $PROD_POSTGRES_PASSWORD
    NSFT_DB_NAME: $PROD_NSFT_DB_NAME
    SECRET_KEY: $PROD_SECRET_KEY
    ADMIN_USER_PASSWORD: $PROD_ADMIN_USER_PASSWORD
  when: manual
  environment:
    name: prod
    url: https://nsft.nath-server.home
  needs:
    - build_docker
    - pytest
  tags:
    - docker
