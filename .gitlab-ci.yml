variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - populate-proxy
  - docker
  - test
  - demo
  - prod

.deploy_via_ansible: &deploy_via_ansible
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env $CONTEXT --docker-image $DOCKER_IMAGE --docker-registry $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD --container-registry-server $CI_REGISTRY --dependency-proxy-server $CI_DEPENDENCY_PROXY_SERVER --dependency-proxy-username $CI_DEPENDENCY_PROXY_USER --dependency-proxy-password $CI_DEPENDENCY_PROXY_PASSWORD --postgres-user $POSTGRES_USER --postgres-password $POSTGRES_PASSWORD --postgres-db $POSTGRES_DB --nsft-db-name $NSFT_DB_NAME --secret-key $SECRET_KEY --telegram-bot-token $TELEGRAM_BOT_TOKEN --telegram-chat-id $TELEGRAM_CHAT_ID --admin-user-username admin --admin-user-password $ADMIN_USER_PASSWORD --admin-user-first-name Nathanaël --admin-user-last-name Debanne --admin-user-email natha.debanne@gmail.com


bootstrap_dependency_proxy:
  stage: populate-proxy
  image: docker:28.1.1
  variables:
    # Point to your self-hosted registry with port 5050
    CI_DEPENDENCY_PROXY_SERVER: "gitlab.nath-server.home:5050"
    CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX: "homelab/dependency_proxy/containers"
  before_script:
    # Login to your GitLab registry / dependency proxy
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - echo "Bootstrapping dependency proxy with commonly used images..."
    
    # List of upstream images to cache
    - export IMAGES="python:3.11-slim docker:28.1.1 postgres:15 nginx:alpine redis:7-alpine alpine:latest"
    
    # Loop over images and pull through dependency proxy
    - |
      for img in $IMAGES; do
        echo "Processing $img..."
        # Construct full proxy path
        PROXY_IMG="$CI_DEPENDENCY_PROXY_SERVER/$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/$(echo $img | cut -d: -f1):$(echo $img | cut -d: -f2)"
        # Pull via dependency proxy (GitLab will auto-cache if image exists upstream)
        docker pull $PROXY_IMG || {
          echo "Proxy cache miss for $img — pulling upstream directly and retrying..."
          # Pull from Docker Hub
          docker pull $img
          # Tag it for proxy path
          docker tag $img $PROXY_IMG
          # Attempt push — may fail if GitLab blocks write (CE/EE behavior)
          docker push $PROXY_IMG || echo "Push to proxy blocked — first CI pull will auto-cache"
        }
      done

    - echo "Dependency proxy bootstrap complete!"
  only:
    - master
    - tags
  when: manual
  tags:
    - docker




build_docker:
  stage: docker
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - docker info
    - docker build --build-arg BASE_IMAGE=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags
  tags:
    - docker

pytest:
  stage: test
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.test.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: test
    POSTGRES_PASSWORD: $TEST_POSTGRES_PASSWORD
    NSFT_DB_NAME: $TEST_NSFT_DB_NAME
    SECRET_KEY: $TEST_SECRET_KEY
    ADMIN_USER_PASSWORD: $TEST_ADMIN_USER_PASSWORD
  environment:
    name: test
    url: https://nsft.test.nath-server.home
  needs:
    - build_docker
  tags:
    - docker

pep8:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  script:
    - pip install flake8
    - flake8 nath_standalone_flask_template | tee pep8.out || true
  allow_failure: true
  artifacts:
    paths:
      - pep8.out
    expire_in: 1 week
  when: manual
  tags:
    - docker

deploy_demo:
  stage: demo
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.demo.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: demo
    POSTGRES_PASSWORD: $DEMO_POSTGRES_PASSWORD
    NSFT_DB_NAME: $DEMO_NSFT_DB_NAME
    SECRET_KEY: $DEMO_SECRET_KEY
    ADMIN_USER_PASSWORD: $DEMO_ADMIN_USER_PASSWORD
  when: manual
  environment:
    name: demo
    url: https://nsft.demo.nath-server.home
  needs:
    - build_docker
    - pytest
  tags:
    - docker

deploy_prod:
  stage: prod
  <<: *deploy_via_ansible
  variables:
    SSH_HOST: nsft.nath-server.home
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
    CONTEXT: prod
    POSTGRES_PASSWORD: $PROD_POSTGRES_PASSWORD
    NSFT_DB_NAME: $PROD_NSFT_DB_NAME
    SECRET_KEY: $PROD_SECRET_KEY
    ADMIN_USER_PASSWORD: $PROD_ADMIN_USER_PASSWORD
  when: manual
  environment:
    name: prod
    url: https://nsft.nath-server.home
  needs:
    - build_docker
    - pytest
  tags:
    - docker
