---
# Container management tasks

- name: Render docker-compose file on remote
  template:
    src: docker-compose.yml.j2
    dest: /opt/nath_standalone_flask_template_data/docker-compose.yml
    mode: '0644'

- name: Docker compose down (deploy only)
  command: docker compose -f /opt/nath_standalone_flask_template_data/docker-compose.yml down --remove-orphans
  register: compose_down
  changed_when: compose_down.rc == 0
  when: action == 'deploy'

- name: Docker compose up
  command: docker compose -f /opt/nath_standalone_flask_template_data/docker-compose.yml up -d --pull always --remove-orphans
  register: compose_up
  changed_when: compose_up.rc == 0

- name: Wait for database container to be healthy
  docker_container_info:
    name: "{{ db_container_name }}"
  register: db_info
  until: db_info.container.State.Health.Status == "healthy"
  retries: 20
  delay: 3

- name: Wait for Redis container to be healthy
  docker_container_info:
    name: "{{ redis_container_name }}"
  register: redis_info
  until: redis_info.container.State.Health.Status == "healthy"
  retries: 20
  delay: 3

- name: Wait for app container to be running
  docker_container_info:
    name: "{{ container_name }}"
  register: app_info
  until: app_info.container.State.Status == "running"
  retries: 20
  delay: 3