---
# Directory and permission setup tasks

- name: Create necessary directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  with_items:
    - /var/log/nath_standalone_flask_template
    - /var/backups/nath_standalone_flask_template
    - /opt/nath_standalone_flask_template_data
    - /opt/nath_standalone_flask_template_data/ssl
    - /opt/nath_standalone_flask_template_data/postgresql/15/main
    - /var/log/nginx
    - /etc/letsencrypt
    - /var/www/html
- name: Set log directory permissions for Docker container
  file:
    path: /var/log/nath_standalone_flask_template
    state: directory
    owner: "1000"  # UID of web user in container
    group: "1000"  # GID of web user in container
    mode: '0775'
    recurse: yes

- name: Create log file with correct permissions
  file:
    path: /var/log/nath_standalone_flask_template/nath_standalone_flask_template.log
    state: touch
    owner: "1000"
    group: "1000"
    mode: '0664'

- name: Set data directory permissions for Docker container
  file:
    path: /opt/nath_standalone_flask_template_data
    state: directory
    owner: "1000"  # UID of web user in container
    group: "1000"  # GID of web user in container
    mode: '0775'
    recurse: yes

- name: Set PostgreSQL data directory permissions
  file:
    path: /opt/nath_standalone_flask_template_data/postgresql/15/main
    state: directory
    owner: "999"  # UID of postgres user in container
    group: "999"  # GID of postgres user in container
    mode: '0775'
    recurse: yes

- name: Set Nginx log directory permissions
  file:
    path: /var/log/nginx
    state: directory
    owner: "101"  # Nginx user
    group: "101"  # Nginx group
    mode: '0775'
    recurse: yes

- name: Set backup directory permissions for Docker container
  file:
    path: /var/backups/nath_standalone_flask_template
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'
    recurse: yes