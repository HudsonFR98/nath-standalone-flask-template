---
# Docker installation tasks

# apt_repository needs /usr/bin/gpg. Debian 13 dropped apt-key and does not
# install gpg by default; gnupg-agent alone does not provide the binary.
- name: Install GnuPG for apt repository management
  apt:
    name: gnupg
    state: present
    update_cache: yes

- name: Remove legacy Docker repository definitions
  apt_repository:
    repo: "{{ item }}"
    state: absent
  loop:
    - "deb [arch=amd64] https://download.docker.com/linux/debian bookworm stable"
    - "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"

- name: Ensure APT keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssl
    state: present
    update_cache: yes

- name: Install PostgreSQL client
  apt:
    name: postgresql-client
    state: present
    update_cache: yes

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker
  apt:
    name: 
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes 