---
# File copying tasks

- name: Copy init-db.sh script to remote
  copy:
    src: ../init-db.sh
    dest: /opt/nath_standalone_flask_template_data/init-db.sh
    mode: '0755'

- name: Copy reset.sql script to remote
  copy:
    src: ../../nath_standalone_flask_template/tests/reset.sql
    dest: /opt/nath_standalone_flask_template_data/init.sql
    mode: '0644'

- name: Copy Nginx configuration
  copy:
    src: "../nginx_{{ context }}.conf"
    dest: "/opt/nath_standalone_flask_template_data/nginx.conf"
    mode: '0644'

- name: Generate self-signed TLS certificate for production
  command: >
    openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 825
    -keyout /opt/nath_standalone_flask_template_data/ssl/nsft-selfsigned.key
    -out /opt/nath_standalone_flask_template_data/ssl/nsft-selfsigned.crt
    -subj "/C=FR/ST=IDF/L=Paris/O=Nath/OU=IT/CN=nsft.nath-server.home"
    -addext "subjectAltName=DNS:nsft.nath-server.home"
  args:
    creates: /opt/nath_standalone_flask_template_data/ssl/nsft-selfsigned.crt
  when: context == 'prod'