---
# Docker registry authentication tasks

- name: Log in to GitLab Container Registry
  docker_login:
    registry: "{{ container_registry_server }}"
    username: "{{ registry_username }}"
    password: "{{ registry_password }}"
    state: present
    reauthorize: yes

- name: Log in to GitLab Dependency Proxy
  docker_login:
    registry: "{{ dependency_proxy_server }}"
    username: "{{ dependency_proxy_username }}"
    password: "{{ dependency_proxy_password }}"
    state: present
    reauthorize: yes 