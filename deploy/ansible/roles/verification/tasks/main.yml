---
# HTTP reachability check after the stack is up.
# The integration test suite runs in a later CI job (ansible/run_tests.yml).

- name: Verify nginx answers on port 80
  ansible.builtin.uri:
    url: "http://127.0.0.1/health"
    status_code: 200
    follow_redirects: none
  register: health
  retries: 12
  delay: 5
  until: health.status == 200
