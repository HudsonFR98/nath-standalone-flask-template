# HTTP-only Nginx configuration for Nath Standalone Flask Template Validation Environment

upstream nath_standalone_flask_templateapp {
    server nsft_app_validation:8080;
}

server {
    listen 80;
    server_name nsft.validation.nath-server.home;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/nath_standalone_flask_templatevalidation_access.log;
    error_log /var/log/nginx/nath_standalone_flask_templatevalidation_error.log;
    
    # Main application (including static files)
    location / {
        proxy_pass http://nath_standalone_flask_templateapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
} 