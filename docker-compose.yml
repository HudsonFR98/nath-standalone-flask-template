# Project name prefixes containers, volumes, and networks (e.g. nsft-prod, nsft-dev).
# Set NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT in .env (dev, prod, validation, …).
name: "nsft-${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}"

services:
  app:
    build: .
    container_name: "nsft_app_${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Same value as in .env; default dev if missing (drives lib/_config.py and container names below).
      NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT: ${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}
      DB_IP: db
      PATH: /opt/env3/nath_standalone_flask_template/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/nath_standalone_flask_template:cached
      - ./logs:/var/log/nath_standalone_flask_template
      - ./backups:/var/backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  db:
    image: postgres:15
    container_name: "nsft_db_${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nath_standalone_flask_template/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5433:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: "nsft_redis_${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}"
    ports:
      - "6380:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

networks:
  default:
    name: "nsft_network_${NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT:-dev}"