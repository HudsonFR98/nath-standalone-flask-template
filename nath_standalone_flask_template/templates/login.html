
{% extends "base.html" %}

{% block body %}
<div class="login-page">
    <div class="card card-container">
        <form class="form-signin" method="POST" action="{{ url_for('.login') }}">
            <input id="usr" name="USR" class="form-control" placeholder="{{ _('User ID') }}"
                required autofocus
                style="margin-bottom: 5px">
            <input type="password" id="pwd" name="PWD" class="form-control"
                placeholder="{{ _('Password') }}" required style="margin-bottom: 5px">
            <button class="btn btn-primary w-100 mb-2" type="submit">{{ _('Login') }}</button>
        </form>
        {% if validation_reviewer_guest_login %}
        <form method="POST" action="{{ url_for('auth.login_reviewer_guest') }}" class="mt-2">
            <button type="submit" class="btn btn-outline-secondary w-100">
                {{ _('Connect as reviewer') }}
            </button>
        </form>
        {% endif %}
    </div>
</div>
{% endblock %}
