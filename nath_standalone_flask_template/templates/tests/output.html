{% extends "base.html" %}

{% block body %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0"><i class="fas fa-terminal"></i> Last Test Run Output</h3>
                </div>
                <div class="card-body">
                    {% if has_output %}
                        <div class="test-output-container">
                            <pre class="test-output">{{ test_output }}</pre>
                        </div>
                    {% else %}
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            {{ test_output }}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
